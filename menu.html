            border-color: #2D5016;
        }
        .category-btn {
            transition: all 0.2s ease;
        }
        .category-btn:hover:not(.active) {
            background: rgba(45, 80, 22, 0.08);
            border-color: rgba(45, 80, 22, 0.3);
        }

        .menu-item {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .menu-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(45, 80, 22, 0.08);
        }

        .cart-badge {
            animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .cart-panel {
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cart-panel.open {
            transform: translateX(0);
        }

        .overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeUp 0.4s ease forwards;
        }

        .qty-btn {
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .qty-btn:hover { background: #2D5016; color: #FDFAF6; }
        .qty-btn:active { transform: scale(0.9); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3A6B35; border-radius: 3px; }

        .toast {
            transform: translateY(0);
            opacity: 1;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .toast-hidden {
            transform: translateY(100px);
            opacity: 0;
        }

        .add-btn-flash {
            animation: flash 0.3s ease;
        }
        @keyframes flash {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); background: #2D5016; color: #FDFAF6; }
            100% { transform: scale(1); }
        }

    let cart = [];
    let activeCategory = 'all';
    let searchQuery = '';
    let toastTimeout = null;

    // Use ID-based lookup instead of string matching
    function getItemById(id) {
        return MENU_DATA.find(item => item.id === id);
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function getFilteredItems() {
        let items = activeCategory === 'all' ? MENU_DATA : MENU_DATA.filter(i => i.category === activeCategory);
        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            items = items.filter(i => i.name.toLowerCase().includes(q));
        }
        return items;
    }

    function renderMenu() {
        const container = document.getElementById('menuContainer');
        const noResults = document.getElementById('noResults');
        const items = getFilteredItems();

        if (items.length === 0) {
            container.innerHTML = '';
            noResults.classList.remove('hidden');
            return;
        }
        noResults.classList.add('hidden');

        container.innerHTML = items.map((item, idx) => `
            <div class="menu-item bg-white rounded-2xl border border-boss-green/5 p-4 flex items-center justify-between gap-3 animate-in" style="animation-delay: ${Math.min(idx * 20, 200)}ms">
                <div class="flex-1 min-w-0">
                    <h3 class="font-medium text-boss-dark text-sm truncate">${escapeHtml(item.name)}</h3>
                    <span class="text-boss-green font-semibold text-sm">${item.price} EGP</span>
                </div>
                <button data-add-id="${item.id}" class="add-btn shrink-0 w-9 h-9 rounded-full border-2 border-boss-green/20 flex items-center justify-center text-boss-green hover:bg-boss-green hover:text-boss-cream hover:border-boss-green transition-all duration-200 active:scale-90">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </div>
        `).join('');
    }

    function addToCart(id) {
        const item = getItemById(id);
        if (!item) return;
        const existing = cart.find(i => i.id === id);
        if (existing) {
            existing.qty++;
        } else {
            cart.push({ id: item.id, name: item.name, price: item.price, qty: 1 });
        }
        updateCartUI();
        showToast(item.name + ' added');
    }

    function removeFromCart(id) {
        cart = cart.filter(i => i.id !== id);
        updateCartUI();
    }

    function updateQty(id, delta) {
        const item = cart.find(i => i.id === id);
        if (!item) return;
        item.qty += delta;
        if (item.qty <= 0) {
            cart = cart.filter(i => i.id !== id);
        }
        updateCartUI();
    }

    function updateCartUI() {
        const countEl = document.getElementById('cartCount');
        const itemsEl = document.getElementById('cartItems');
        const emptyEl = document.getElementById('emptyCart');
        const footerEl = document.getElementById('cartFooter');
        const totalEl = document.getElementById('cartTotal');
        const checkoutTotalEl = document.getElementById('checkoutTotal');

        const totalItems = cart.reduce((s, i) => s + i.qty, 0);
        const totalPrice = cart.reduce((s, i) => s + i.price * i.qty, 0);

        if (totalItems > 0) {
            countEl.style.display = 'flex';
            countEl.textContent = totalItems;
            emptyEl.style.display = 'none';
            itemsEl.style.display = '';
            footerEl.classList.remove('hidden');
        } else {
            countEl.style.display = 'none';
            emptyEl.style.display = '';
            itemsEl.style.display = 'none';
            itemsEl.innerHTML = '';
            footerEl.classList.add('hidden');
        }

        totalEl.textContent = totalPrice + ' EGP';
        checkoutTotalEl.textContent = totalPrice + ' EGP';

        if (cart.length > 0) {
            itemsEl.innerHTML = cart.map(item => `
                <div class="flex items-center gap-3 py-3 border-b border-boss-green/5 last:border-0">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-boss-dark truncate">${escapeHtml(item.name)}</p>
                        <p class="text-xs text-boss-dark/50">${item.price} EGP each</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button data-qty-id="${item.id}" data-delta="-1" class="qty-btn w-7 h-7 rounded-full border border-boss-green/20 flex items-center justify-center text-boss-green text-sm font-bold">−</button>
                        <span class="w-6 text-center text-sm font-semibold text-boss-dark">${item.qty}</span>
                        <button data-qty-id="${item.id}" data-delta="1" class="qty-btn w-7 h-7 rounded-full border border-boss-green/20 flex items-center justify-center text-boss-green text-sm font-bold">+</button>
                    </div>
                    <button data-remove-id="${item.id}" class="text-red-400 hover:text-red-600 transition-colors ml-1">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                </div>
            `).join('');
        }
    }

    function openCart() {
        document.getElementById('cartPanel').classList.add('open');
        document.getElementById('cartOverlay').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeCart() {
        document.getElementById('cartPanel').classList.remove('open');
        document.getElementById('cartOverlay').classList.remove('open');
        document.body.style.overflow = '';
        hideCheckout();
    }

    function showCheckout() {
        document.getElementById('cartFooter').classList.add('hidden');
        document.getElementById('cartScrollArea').style.display = 'none';
        document.getElementById('checkoutForm').classList.remove('hidden');
    }

    function hideCheckout() {
        document.getElementById('cartFooter').classList.remove('hidden');
        document.getElementById('cartScrollArea').style.display = '';
        document.getElementById('checkoutForm').classList.add('hidden');
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        if (toastTimeout) {
            clearTimeout(toastTimeout);
            toastTimeout = null;
        }
        toast.textContent = msg;
        toast.classList.remove('toast-hidden');
        toast.classList.add('toast');
        toastTimeout = setTimeout(() => {
            toast.classList.add('toast-hidden');
            toast.classList.remove('toast');
            toastTimeout = null;
        }, 2000);
    }

    async function submitOrder() {
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('custPhone').value.trim();
        const notes = document.getElementById('custNotes').value.trim();

        if (!name) { showToast('Please enter your name'); return; }
        if (!phone || phone.length < 10) { showToast('Please enter a valid phone number'); return; }

        const btn = document.getElementById('submitBtn');
        btn.textContent = 'Sending...';
        btn.disabled = true;

        const totalPrice = cart.reduce((s, i) => s + i.price * i.qty, 0);
        const orderItems = cart.map(i => i.qty + 'x ' + i.name + ' — ' + (i.price * i.qty) + ' EGP').join('\n');

        const orderText = 'NEW ORDER — Bake Boss\n\nCustomer: ' + name + '\nPhone: +20' + phone + (notes ? '\nNotes: ' + notes : '') + '\n\n--- ITEMS ---\n' + orderItems + '\n\n--- TOTAL: ' + totalPrice + ' EGP ---';

        // Send via mailto (reliable fallback)
        const subject = encodeURIComponent('New Order from ' + name + ' — Bake Boss');
        const body = encodeURIComponent(orderText);
        window.open('mailto:ohady3355@gmail.com?subject=' + subject + '&body=' + body, '_blank');
        showToast('Order sent!');
        cart = [];
        updateCartUI();
        closeCart();

        btn.textContent = 'Place Order';
        btn.disabled = false;
    }

    // --- EVENT DELEGATION ---

    // Menu add buttons (delegation on container)
    document.getElementById('menuContainer').addEventListener('click', function(e) {
        const btn = e.target.closest('[data-add-id]');
        if (!btn) return;
        const id = parseInt(btn.dataset.addId);
        addToCart(id);
        btn.classList.remove('add-btn-flash');
        void btn.offsetWidth; // force reflow
        btn.classList.add('add-btn-flash');
    });

    // Cart panel delegation
    document.getElementById('cartPanel').addEventListener('click', function(e) {
        const qtyBtn = e.target.closest('[data-qty-id]');
        if (qtyBtn) {
            const id = parseInt(qtyBtn.dataset.qtyId);
            const delta = parseInt(qtyBtn.dataset.delta);
            updateQty(id, delta);
            return;
        }
        const removeBtn = e.target.closest('[data-remove-id]');
        if (removeBtn) {
            const id = parseInt(removeBtn.dataset.removeId);
            removeFromCart(id);
            return;
        }
    });

    // Category filter
    document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeCategory = btn.dataset.category;
            renderMenu();
        });
    });

    // Search
    document.getElementById('searchInput').addEventListener('input', function(e) {
        searchQuery = e.target.value.trim();
        renderMenu();
    });

    // Cart toggle
    document.getElementById('cartToggle').addEventListener('click', openCart);
    document.getElementById('cartOverlay').addEventListener('click', closeCart);
    document.getElementById('closeCartBtn').addEventListener('click', closeCart);
    document.getElementById('checkoutBtn').addEventListener('click', showCheckout);
    document.getElementById('submitBtn').addEventListener('click', submitOrder);
    document.getElementById('backToCartBtn').addEventListener('click', hideCheckout);

    // Init
    renderMenu();
    </script>
</body>
</html>
